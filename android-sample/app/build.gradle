plugins { id 'com.android.application' }
android {
    namespace 'com.aihwstack.recordersample'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aihwstack.recordersample'
        minSdk 23
        targetSdk 33
        versionCode 2
        versionName '1.1.0'
    }
    // Release signing is read from ~/.gradle/gradle.properties (or -P) so no key or password is in this repository:
    // RECSAMPLE_STORE_FILE, RECSAMPLE_STORE_PASSWORD, RECSAMPLE_KEY_ALIAS, RECSAMPLE_KEY_PASSWORD.
    // Without them, assembleRelease builds an unsigned APK; sign it with your own key.
    signingConfigs {
        release {
            if (project.hasProperty('RECSAMPLE_STORE_FILE')) {
                storeFile file(RECSAMPLE_STORE_FILE)
                storePassword RECSAMPLE_STORE_PASSWORD
                keyAlias RECSAMPLE_KEY_ALIAS
                keyPassword RECSAMPLE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('RECSAMPLE_STORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false }
}
